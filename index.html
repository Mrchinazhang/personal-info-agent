<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>个人信息管家 Agent</title>
  <link rel="stylesheet" href="styles.css?v=20261103a" />
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
</head>
<body>

  <!-- ============ 登录 ============ -->
  <section id="auth-view" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo">🧠</div>
        <h1>个人信息管家</h1>
        <p>记下零散的想法、资料与待办，让 AI 自动分类、总结、关联</p>
      </div>

      <div class="auth-form">
        <label for="phone-input">手机号</label>
        <input id="phone-input" type="tel" inputmode="numeric" maxlength="11" placeholder="请输入 11 位手机号" autocomplete="tel" />
        <p id="phone-error" class="field-error"></p>

        <label for="code-input">验证码</label>
        <div class="code-row">
          <input id="code-input" type="text" inputmode="numeric" maxlength="8" placeholder="短信验证码" autocomplete="one-time-code" />
          <button id="send-code-btn" type="button" class="btn-ghost">获取验证码</button>
        </div>

        <button id="login-btn" type="button" class="btn-primary">登录 / 注册</button>

        <div class="divider"><span>或</span></div>
        <button id="wechat-btn" type="button" class="btn-wechat">微信登录</button>

        <p id="auth-error" class="form-error"></p>
        <p class="auth-tip">未注册的手机号将自动创建账号，无需设置密码。</p>
        <p class="auth-privacy">手机号仅用于接收登录验证码，不作其他用途；你记录的内容保存在云端数据库，按账号隔离，仅你本人可见。需要注销账号或删除全部数据，请联系作者。</p>
      </div>
    </div>
  </section>

  <!-- ============ 应用主体 ============ -->
  <section id="app-view" class="hidden">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">🧠</span> 个人信息管家</div>
      <div class="topbar-right">
        <label class="model-picker">
          模型
          <select id="model-select" title="选择用于整理与问答的大模型"></select>
        </label>
        <div class="user-chip" id="user-chip"></div>
        <button id="logout-btn" type="button" class="btn-ghost-sm">退出</button>
      </div>
    </header>

    <div class="shell">
      <nav class="sidebar" id="sidebar">
        <button type="button" data-view="capture" class="nav-btn">✍️ 快速记录</button>
        <button type="button" data-view="import" class="nav-btn">📥 内容导入</button>
        <button type="button" data-view="library" class="nav-btn">📚 我的资料库</button>
        <button type="button" data-view="todos" class="nav-btn">✅ 待办整理</button>
        <button type="button" data-view="ask" class="nav-btn">💬 智能问答</button>
        <button type="button" data-view="reports" class="nav-btn">📊 阶段总结</button>
      </nav>
      <main id="main" class="main"></main>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-body"></div></div>

  <script src="config.js?v=20261103a"></script>
  <script src="app.js?v=20261103a"></script>
</body>
</html>
